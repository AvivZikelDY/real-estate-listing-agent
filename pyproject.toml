[project]
name = "listing-agent"
version = "0.1.0"
description = "Tel Aviv Real Estate Listing Triage Agent"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pillow",
]

# Build backend requirements, mirrored from [build-system].requires so they can
# be exported into a hash-pinned lock file. Installing these up front lets us
# build the project with --no-build-isolation, which keeps pip from silently
# fetching an unverified setuptools from the index at build time.
[dependency-groups]
build = [
    "setuptools>=68",
    "wheel",
]

[tool.uv]
# Supply-chain guard: refuse any distribution artifact uploaded in the last
# 7 days. Freshly published releases are the window in which compromised
# maintainer accounts and typosquats are usually caught and yanked, so we
# deliberately lag the bleeding edge instead of resolving to it.
exclude-newer = "7 days"

# Per-package overrides for the cooldown above. Use sparingly, and only for
# packages we publish/control ourselves:
#   some-internal-pkg = "0 days"
[tool.uv.exclude-newer-package]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in a function default is the documented,
# idiomatic dependency-injection pattern - not the mutable-default-argument
# bug B008 warns about.
"src/listing_agent/api/routes.py" = ["B008"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
